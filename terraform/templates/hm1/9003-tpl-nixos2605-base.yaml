# VM template spec (docs/templates.md; homelab-standards PR #17). Faris decision 6 (PM's reading): built by the
# pipeline in a throwaway stg VM (clone of 9000) with nixos-generators, then sealed with one ssh boot in stg.
# TODO before merge: pin nixpkgs_rev (a nixos-26.05 commit) and generators_rev (nix-community/nixos-generators).
name: tpl-nixos2605-base
vmid: 9003
os: nixos
description: NixOS 26.05 (nixos-generators qcow) + cloud-init, qemu-guest-agent, python3
source:
  kind: nixos-build
  version: "26.05"
  config: terraform/templates/hm1/nixos/configuration.nix
  nixpkgs_rev: null
  generators_rev: null
settings: {}
seal: ssh          # hygiene + boot check only: the configuration is declarative, so no provision steps
provision: []
refresh: monthly   # bump nixpkgs_rev on the same release branch = minor refresh (Class B)
