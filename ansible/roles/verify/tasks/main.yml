- name: Pinned Goss on the runner matches tests/goss.version
  ansible.builtin.stat:
    path: "/opt/goss/{{ verify_goss.version }}/goss"
    checksum_algorithm: sha256
  register: verify_goss_local
  delegate_to: localhost
  run_once: true

- name: Goss checksum
  ansible.builtin.assert:
    that:
      - verify_goss_local.stat.exists
      - verify_goss_local.stat.checksum == verify_goss.binary_sha256
    fail_msg: "/opt/goss/{{ verify_goss.version }}/goss missing or not the pinned build (rebuild/v7/devops/05-goss.sh)"
  run_once: true

- name: Goss on the guest
  ansible.builtin.copy:
    src: "/opt/goss/{{ verify_goss.version }}/goss"
    dest: /usr/local/bin/goss
    mode: "0755"

- name: Test directory
  ansible.builtin.file:
    path: /etc/hm1/goss
    state: directory
    mode: "0750"

- name: OS baseline tests
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../tests/os/{{ verify_os_family }}.goss.yaml.j2"
    dest: /etc/hm1/goss/baseline.yaml
    mode: "0640"

- name: Run (L3)
  ansible.builtin.command: /usr/local/bin/goss -g /etc/hm1/goss/baseline.yaml validate --format json --no-color
  register: verify_l3
  changed_when: false
  failed_when: false

- name: Results to the runner
  ansible.builtin.copy:
    content: "{{ verify_l3.stdout if verify_l3.stdout | length > 0 else ({'error': verify_l3.stderr | default('no output')} | to_json) }}"
    dest: "{{ verify_out }}/{{ inventory_hostname }}.l3.json"
    mode: "0640"
  delegate_to: localhost

# ---- L4 app checks (tests/apps/<role>.goss.yaml.j2). Runs after L3 is written, as a separate Goss run with its own
# result file: an app problem (or a render error here) can neither hide nor break the L3 result above. A render error
# leaves no <host>.l4.json, which scripts/verify.py reports as a failure.
- name: App checks (L4)
  when: verify_app_tests is file
  block:
    - name: App tests
      ansible.builtin.template:
        src: "{{ verify_app_tests }}"
        dest: /etc/hm1/goss/app.yaml
        mode: "0640"

    # Same render on the runner: scripts/verify.py re-runs a failed command from it over SSH to show its output,
    # which Goss can't report (issue #102).
    - name: App tests copy for the evidence (runner)
      ansible.builtin.template:
        src: "{{ verify_app_tests }}"
        dest: "{{ verify_out }}/{{ inventory_hostname }}.l4.yaml"
        mode: "0640"
      delegate_to: localhost

    - name: Run (L4)
      ansible.builtin.command: /usr/local/bin/goss -g /etc/hm1/goss/app.yaml validate --format json --no-color
      register: verify_l4
      changed_when: false
      failed_when: false

    - name: L4 results to the runner
      ansible.builtin.copy:
        content: "{{ verify_l4.stdout if verify_l4.stdout | length > 0 else ({'error': verify_l4.stderr | default('no output')} | to_json) }}"
        dest: "{{ verify_out }}/{{ inventory_hostname }}.l4.json"
        mode: "0640"
      delegate_to: localhost
