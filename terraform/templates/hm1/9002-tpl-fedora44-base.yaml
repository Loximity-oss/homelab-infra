# VM template spec (docs/templates.md; homelab-standards PR #17). Built by the `template` workflow after merge.
# TODO before merge: exact image file name (<build>) and sha256 from the signed Fedora-Cloud-44-<build>-x86_64-CHECKSUM;
# optionally signature {type: clearsigned-checksum, key: terraform/templates/keys/fedora-44.asc, fingerprint}.
name: tpl-fedora44-base
vmid: 9002
os: fedora44
description: Fedora 44 Cloud Base Generic + cloud-init, qemu-guest-agent, python3
source:
  kind: image
  url: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-<build>.x86_64.qcow2
  version: "44-<build>"
  sha256: null
settings: {}
seal: ssh
seal_user: fedora   # image default user (sudo); root login is enabled by the provision steps below
provision:
  - dnf -y install python3 qemu-guest-agent cloud-utils-growpart
  - for u in sshd qemu-guest-agent cloud-init-local cloud-init-main cloud-init-network cloud-init cloud-config cloud-final; do systemctl cat "$u.service" >/dev/null 2>&1 && systemctl enable "$u.service"; done; true
  - printf 'disable_root: false\n' > /etc/cloud/cloud.cfg.d/90-hm1-root.cfg
  - printf 'PermitRootLogin prohibit-password\nPasswordAuthentication no\n' > /etc/ssh/sshd_config.d/10-hm1.conf
  - restorecon -R /etc/cloud/cloud.cfg.d /etc/ssh/sshd_config.d
refresh: release   # release images are not respun; a new Fedora release is a new template (Class C)
