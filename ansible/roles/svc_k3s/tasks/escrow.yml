# Escrow of the k3s join tokens in OpenBao, create-only (cas=0), never read back by the pipeline. Run through
# `include_role: svc_k3s tasks_from: escrow` by the last play of site.yml, on the first control node only, after the
# whole cluster is up. A failed write therefore fails only that play: the cluster is already complete and nothing is
# restarted. Same pattern as app_adguard (admin password). The marker file is written only after a successful write.
# Secret: <zone>/secret/apps/k3s/<first control node>, keys server_token and agent_token. Faris reads it.
- name: Escrow marker
  ansible.builtin.stat:
    path: "{{ svc_k3s_escrow_marker }}"
  register: _k3s_escrow_marker

- name: Store the tokens once
  when: not _k3s_escrow_marker.stat.exists
  no_log: true
  block:
    - name: Read the server token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/token
      register: _k3s_escrow_server

    - name: Read the agent token
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/agent-token
      register: _k3s_escrow_agent

    - name: Write once to OpenBao (create-only)
      ansible.builtin.uri:
        url: "{{ svc_k3s_escrow_bao_url }}/v1/{{ 'secret' if lookup('env', 'BAO_ZONE_MODE') != 'mount' else 'secret-' ~ zone }}/data/apps/k3s/{{ inventory_hostname }}"
        method: POST
        ca_path: /etc/openbao/ca.crt
        headers: "{{ {'X-Vault-Token': lookup('env', 'GUEST_SECRET_TOKEN')} | combine({'X-Vault-Namespace': zone} if lookup('env', 'BAO_ZONE_MODE') != 'mount' else {}) }}"
        body_format: json
        body:
          options: {cas: 0}
          data:
            server_token: "{{ _k3s_escrow_server.content | b64decode | trim }}"
            agent_token: "{{ _k3s_escrow_agent.content | b64decode | trim }}"
        status_code: [200, 204]
      delegate_to: localhost

    - name: Marker directory
      ansible.builtin.file:
        path: /etc/hm1
        state: directory
        mode: "0700"

    - name: Marker (after the successful write only)
      ansible.builtin.copy:
        dest: "{{ svc_k3s_escrow_marker }}"
        content: "stored in OpenBao {{ zone }}/secret/apps/k3s/{{ inventory_hostname }}\n"
        mode: "0600"
