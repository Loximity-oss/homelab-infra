name: apply
on:
  push:
    branches: [main]
jobs:
  apply:
    runs-on: host-apply
    # > template lock wait (60 min) + host lock wait (60 min) + the longest apply (proposal 2.3, step 4b)
    timeout-minutes: 240
    steps:
      - name: apply saved plan, configure hosts
        env:
          GIT_TOKEN: ${{ gitea.token }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          SHA: ${{ gitea.sha }}
          APPS_DISPATCH: "1" # cutover step 10(d), infra #127: dispatch homelab-apps deploy for configured hosts
        run: |
          rm -rf base
          git clone -q "${SERVER%%://*}://ci:${GIT_TOKEN}@${SERVER#*://}/${REPO}.git" base
          git -C base checkout -q "$SHA"
          # Shared lock with template builds (standards PR #17): no guest clones a template while it is replaced.
          # Without the lock dir no template build can run either (ci-template.sh fails closed), so no lock is needed.
          if [ -d /var/lib/devops/locks ]; then
            flock -s -w 3600 /var/lib/devops/locks/templates.lock bash base/scripts/ci-apply.sh
          else
            bash base/scripts/ci-apply.sh
          fi
