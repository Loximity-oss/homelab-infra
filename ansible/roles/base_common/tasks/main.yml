- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

- name: Set hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: One-time admin password into OpenBao (design-v7 decision 9)
  ansible.builtin.include_tasks: admin_secret.yml
  when: lookup('env', 'GUEST_SECRET_TOKEN') | length > 0
