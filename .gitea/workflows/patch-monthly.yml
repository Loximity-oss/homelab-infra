name: patch-monthly
# Last Saturday 02:00 MYT (docs/patching-pipeline.md): applies the month's bundle (patch_max_sev=4, only the approved
# Sev3/4 packages) ONLY if its PR was merged with a current APPROVED review by faris. Snapshot first, never reboots.
# The cron fires every Saturday 02:00 MYT; ci-patch.sh exits 0 unless it is the last Saturday of the month (MYT).
on:
  schedule:
    - cron: "0 18 * * 5" # Friday 18:00 UTC = Saturday 02:00 MYT
  workflow_dispatch: {}
jobs:
  monthly:
    runs-on: host-apply
    steps:
      - name: apply the approved monthly bundle
        env:
          GIT_TOKEN: ${{ gitea.token }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
        run: |
          rm -rf base
          git clone -q "${SERVER%%://*}://ci:${GIT_TOKEN}@${SERVER#*://}/${REPO}.git" base
          if [ -d /var/lib/devops/locks ]; then
            flock -w 7200 /var/lib/devops/locks/patch.lock bash base/scripts/ci-patch.sh monthly
          else
            bash base/scripts/ci-patch.sh monthly
          fi
