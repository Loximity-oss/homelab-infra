# VM template spec (docs/templates.md; homelab-standards PR #17). Built by the `template` workflow after merge.
# TODO before merge: pin url, version and sha256 from the vendor's .SHA256 file for one dated image; optionally add
# signature (.sig + Arch cloud-image signing key under terraform/templates/keys/). `template-build.py check` rejects
# the placeholders below until then.
name: tpl-arch-base
vmid: 9001
os: arch
description: Arch Linux cloud image (rolling) + cloud-init, qemu-guest-agent, python
source:
  kind: image
  url: https://geo.mirror.pkgbuild.com/images/v<YYYYMMDD>.<build>/Arch-Linux-x86_64-cloudimg-<YYYYMMDD>.<build>.qcow2
  version: "<YYYYMMDD>.<build>"
  sha256: null
settings: {}
seal: ssh
seal_user: arch   # image default user (sudo); root login is enabled by the provision steps below
provision:
  - pacman -Sy --noconfirm --needed archlinux-keyring && pacman -Syu --noconfirm --needed python qemu-guest-agent openssh cloud-init cloud-guest-utils
  - for u in sshd qemu-guest-agent cloud-init-local cloud-init-main cloud-init-network cloud-init cloud-config cloud-final systemd-networkd systemd-resolved; do systemctl cat "$u.service" >/dev/null 2>&1 && systemctl enable "$u.service"; done; true
  - printf 'disable_root: false\n' > /etc/cloud/cloud.cfg.d/90-hm1-root.cfg
  - printf 'PermitRootLogin prohibit-password\nPasswordAuthentication no\n' > /etc/ssh/sshd_config.d/10-hm1.conf
  - grep -q 'console=ttyS0' /etc/default/grub || { sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT="/&console=tty0 console=ttyS0,115200 /' /etc/default/grub && grub-mkconfig -o /boot/grub/grub.cfg; }
refresh: monthly
refresh_check:
  checksum_url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2.SHA256
  match: '^Arch-Linux-x86_64-cloudimg.*\.qcow2$'
