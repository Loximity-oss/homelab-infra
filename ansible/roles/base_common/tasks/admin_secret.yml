# Each guest instance gets a random root password exactly once. It is written to OpenBao FIRST (create-only, cas=0) at
# <zone>/secret/guests/<hostname>/<instance>, and only set on the guest if that write succeeded. Never logged, never read
# back by the pipeline; Faris reads it for break-glass. A marker on the guest makes it run once per instance.
- name: Check marker
  ansible.builtin.stat:
    path: /etc/hm1/admin-secret-stored
  register: _admin_marker

- name: Store and set the admin password
  when: not _admin_marker.stat.exists
  no_log: true
  block:
    - name: Instance id
      ansible.builtin.set_fact:
        _instance: "{{ ansible_machine_id[:12] }}"
        _admin_pw: "{{ lookup('ansible.builtin.password', '/dev/null', length=28, chars=['ascii_letters', 'digits']) }}"

    - name: Write once to OpenBao (create-only)
      ansible.builtin.uri:
        url: "https://192.168.70.12:8200/v1/{{ 'secret' if lookup('env', 'BAO_ZONE_MODE') != 'mount' else 'secret-' ~ zone }}/data/guests/{{ inventory_hostname }}/{{ _instance }}"
        method: POST
        ca_path: /etc/openbao/ca.crt
        headers: "{{ {'X-Vault-Token': lookup('env', 'GUEST_SECRET_TOKEN')} | combine({'X-Vault-Namespace': zone} if lookup('env', 'BAO_ZONE_MODE') != 'mount' else {}) }}"
        body_format: json
        body:
          options: {cas: 0}
          data: {root_password: "{{ _admin_pw }}", vmid: "{{ vmid | string }}", created: "{{ ansible_date_time.iso8601 }}"}
        status_code: [200, 204]
      delegate_to: localhost

    - name: Set root password
      ansible.builtin.user:
        name: root
        password: "{{ _admin_pw | password_hash('sha512') }}"

    - name: Marker directory
      ansible.builtin.file:
        path: /etc/hm1
        state: directory
        mode: "0700"

    - name: Marker
      ansible.builtin.copy:
        dest: /etc/hm1/admin-secret-stored
        content: "stored in OpenBao {{ zone }}/secret/guests/{{ inventory_hostname }}/{{ _instance }}\n"
        mode: "0600"
