- name: Install podman and tools
  ansible.builtin.apt:
    name: [podman, openssl, curl, gzip]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

- name: Verify podman works (LXC needs nesting=1,keyctl=1)
  ansible.builtin.command: podman info
  register: app_guac_podman_info
  changed_when: false
  failed_when: app_guac_podman_info.rc != 0

- name: Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - { path: /etc/guac, mode: "0750" }
    - { path: /etc/guac/secrets, mode: "0700" }
    - { path: /var/lib/guac, mode: "0750" }
    - { path: /var/backups/guac, mode: "0700" }

- name: Generate DB password once (stays on the guest)
  ansible.builtin.shell: |
    umask 077
    openssl rand -hex 24 > /etc/guac/secrets/db-password
  args:
    creates: /etc/guac/secrets/db-password

- name: Generate admin password once (replaced by Faris if desired)
  ansible.builtin.shell: |
    umask 077
    openssl rand -base64 24 | tr -d '\n' > /etc/guac/secrets/admin-password
  args:
    creates: /etc/guac/secrets/admin-password

- name: Read DB password
  ansible.builtin.slurp:
    src: /etc/guac/secrets/db-password
  register: app_guac_dbpw
  no_log: true

- name: Render DB env files
  ansible.builtin.copy:
    dest: "/etc/guac/secrets/{{ item.name }}"
    content: "{{ item.key }}={{ app_guac_dbpw.content | b64decode | trim }}\n"
    mode: "0600"
    owner: root
    group: root
  loop:
    - { name: db.env, key: POSTGRES_PASSWORD }
    - { name: web.env, key: POSTGRESQL_PASSWORD }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Tunnel token env file (only when a token is supplied)
  ansible.builtin.copy:
    dest: /etc/guac/secrets/cloudflared.env
    content: "TUNNEL_TOKEN={{ app_guac_cloudflared_token }}\n"
    mode: "0600"
    owner: root
    group: root
  when: app_guac_cloudflared_token | length > 0
  no_log: true
  notify: Restart guac-cloudflared

- name: Quadlet units
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../apps/guac/quadlet/{{ item }}.j2"
    dest: "/etc/containers/systemd/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - guac.network
    - guac-db.container
    - guac-guacd.container
    - guac-web.container
    - guac-cloudflared.container
  notify:
    - Reload systemd
    - Restart guac-web

- name: Helper scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../apps/guac/{{ item.src }}"
    dest: "/usr/local/sbin/{{ item.dest }}"
    mode: "0750"
    owner: root
    group: root
  loop:
    - { src: smoke.sh, dest: guac-smoke }
    - { src: set-admin-password.sh, dest: guac-set-admin-password }
    - { src: backup.sh, dest: guac-backup }

- name: Backup service and timer
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../apps/guac/systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - guac-backup.service
    - guac-backup.timer
  notify: Reload systemd

- name: Apply unit changes now
  ansible.builtin.meta: flush_handlers

- name: Start database and guacd
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop: [guac-db, guac-guacd]

- name: Wait for Postgres
  ansible.builtin.command: podman exec guac-db pg_isready -U guacamole -d guacamole_db
  register: app_guac_pgready
  until: app_guac_pgready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Check whether the schema exists
  ansible.builtin.command: >-
    podman exec guac-db psql -U guacamole -d guacamole_db -tA
    -c "select to_regclass('public.guacamole_user')"
  register: app_guac_schema
  changed_when: false

- name: Initialise schema (generated by the pinned image)
  ansible.builtin.shell: |
    set -e
    podman run --rm docker.io/guacamole/guacamole:{{ app_guac_version }} /opt/guacamole/bin/initdb.sh --postgresql > /var/lib/guac/initdb.sql
    podman exec -i guac-db psql -U guacamole -d guacamole_db -v ON_ERROR_STOP=1 < /var/lib/guac/initdb.sql
  when: app_guac_schema.stdout | trim == ''

- name: Replace the default guacadmin password (before the web app starts)
  ansible.builtin.command: /usr/local/sbin/guac-set-admin-password
  register: app_guac_adminpw
  changed_when: "'CHANGED' in app_guac_adminpw.stdout"

- name: Start web app
  ansible.builtin.systemd:
    name: guac-web
    state: started

- name: Backup timer
  ansible.builtin.systemd:
    name: guac-backup.timer
    state: started
    enabled: true

- name: Tunnel token present?
  ansible.builtin.stat:
    path: /etc/guac/secrets/cloudflared.env
  register: app_guac_cf_env

- name: Start tunnel connector (only when the token exists)
  ansible.builtin.systemd:
    name: guac-cloudflared
    state: started
  when: app_guac_cf_env.stat.exists

- name: Report tunnel disabled
  ansible.builtin.debug:
    msg: "SKIP guac-cloudflared: /etc/guac/secrets/cloudflared.env absent (secret cloudflared-guac01-tunnel not provisioned yet)"
  when: not app_guac_cf_env.stat.exists

- name: Smoke test
  ansible.builtin.command: /usr/local/sbin/guac-smoke
  register: app_guac_smoke
  changed_when: false
  retries: 6
  delay: 10
  until: app_guac_smoke.rc == 0
