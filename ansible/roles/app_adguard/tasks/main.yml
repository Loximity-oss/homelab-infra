# AdGuard Home, native binary (no Docker). Order: free port 53 -> binary -> admin secret -> config -> service -> healthcheck.
- name: Packages
  ansible.builtin.apt:
    name: [bind9-dnsutils]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

# ---- Port 53: switch the systemd-resolved stub listener off before AdGuard starts
- name: Resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Resolved stub listener off
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/adguardhome.conf
    content: |
      [Resolve]
      DNSStubListener=no
    mode: "0644"
  notify: restart resolved

- name: Resolver file state
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: _adguard_resolv

# With the stub off, a resolv.conf pointing at 127.0.0.53 would stop resolving (needed for the download below).
- name: Resolv.conf to the real upstream list when it points at the stub
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: _adguard_resolv.stat.islnk | default(false) and _adguard_resolv.stat.lnk_source | default('') is search('stub-resolv.conf')
  notify: restart resolved

- name: Apply resolved change now
  ansible.builtin.meta: flush_handlers

# ---- Binary
- name: Service user
  ansible.builtin.user:
    name: "{{ app_adguard_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Install directory
  ansible.builtin.file:
    path: "{{ app_adguard_dir }}"
    state: directory
    owner: "{{ app_adguard_user }}"
    mode: "0750"

- name: Work directory
  ansible.builtin.file:
    path: "{{ app_adguard_dir }}/data"
    state: directory
    owner: "{{ app_adguard_user }}"
    mode: "0750"

- name: Installed version
  ansible.builtin.command: "{{ app_adguard_dir }}/AdGuardHome --version"
  register: _adguard_ver
  failed_when: false
  changed_when: false

- name: Download release (sha256 pinned)
  ansible.builtin.get_url:
    url: "{{ app_adguard_url }}"
    dest: "/var/cache/AdGuardHome-{{ app_adguard_version }}.tar.gz"
    checksum: "sha256:{{ app_adguard_sha256 }}"
    mode: "0644"
  when: app_adguard_version not in (_adguard_ver.stdout | default(''))

- name: Unpack binary
  ansible.builtin.unarchive:
    src: "/var/cache/AdGuardHome-{{ app_adguard_version }}.tar.gz"
    dest: "{{ app_adguard_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    include: [AdGuardHome/AdGuardHome]
    mode: "0755"
  when: app_adguard_version not in (_adguard_ver.stdout | default(''))
  notify: restart adguardhome

# ---- Admin password: generated once per guest. OpenBao first (create-only, cas=0, never read back), then the
# bcrypt hash only goes to the guest. The hash file doubles as the "done" marker.
- name: Hash directory
  ansible.builtin.file:
    path: /etc/hm1
    state: directory
    mode: "0700"

- name: Check admin hash
  ansible.builtin.stat:
    path: "{{ app_adguard_hash_file }}"
  register: _adguard_hash

- name: Generate, store and hash the admin password
  when: not _adguard_hash.stat.exists
  no_log: true
  block:
    - name: Generate password
      ansible.builtin.set_fact:
        _adguard_pw: "{{ lookup('ansible.builtin.password', '/dev/null', length=28, chars=['ascii_letters', 'digits']) }}"

    - name: Write once to OpenBao (create-only)
      ansible.builtin.uri:
        url: "https://192.168.70.12:8200/v1/{{ 'secret' if lookup('env', 'BAO_ZONE_MODE') != 'mount' else 'secret-' ~ zone }}/data/apps/adguard/{{ inventory_hostname }}"
        method: POST
        ca_path: /etc/openbao/ca.crt
        headers: "{{ {'X-Vault-Token': lookup('env', 'GUEST_SECRET_TOKEN')} | combine({'X-Vault-Namespace': zone} if lookup('env', 'BAO_ZONE_MODE') != 'mount' else {}) }}"
        body_format: json
        body:
          options: {cas: 0}
          data: {username: "{{ app_adguard_admin_user }}", password: "{{ _adguard_pw }}"}
        status_code: [200, 204]
      delegate_to: localhost

    - name: Keep only the bcrypt hash on the guest
      ansible.builtin.copy:
        dest: "{{ app_adguard_hash_file }}"
        content: "{{ _adguard_pw | password_hash('bcrypt') }}\n"
        mode: "0600"

    - name: Forget the plaintext
      ansible.builtin.set_fact:
        _adguard_pw: ""

- name: Read admin hash
  ansible.builtin.slurp:
    src: "{{ app_adguard_hash_file }}"
  register: _adguard_hash_raw
  no_log: true

- name: Admin hash fact
  ansible.builtin.set_fact:
    _adguard_admin_hash: "{{ _adguard_hash_raw.content | b64decode | trim }}"
  no_log: true

# ---- Config. AdGuard rewrites its own YAML (defaults, migrations), so the rendered copy is compared and the live
# file is only replaced when the rendered copy changes (no restart on every run).
- name: Render config
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../apps/adguard/AdGuardHome.yaml.j2"
    dest: "{{ app_adguard_dir }}/AdGuardHome.yaml.managed"
    owner: "{{ app_adguard_user }}"
    mode: "0600"
  no_log: true
  register: _adguard_cfg

- name: Live config present
  ansible.builtin.stat:
    path: "{{ app_adguard_dir }}/AdGuardHome.yaml"
  register: _adguard_live

- name: Install config
  ansible.builtin.copy:
    src: "{{ app_adguard_dir }}/AdGuardHome.yaml.managed"
    dest: "{{ app_adguard_dir }}/AdGuardHome.yaml"
    remote_src: true
    owner: "{{ app_adguard_user }}"
    mode: "0600"
  when: _adguard_cfg.changed or not _adguard_live.stat.exists
  no_log: true
  notify: restart adguardhome

# ---- Service
- name: Systemd unit
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../apps/adguard/AdGuardHome.service.j2"
    dest: /etc/systemd/system/AdGuardHome.service
    mode: "0644"
  register: _adguard_unit
  notify: restart adguardhome

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: _adguard_unit.changed

- name: Enabled and running
  ansible.builtin.systemd:
    name: AdGuardHome
    enabled: true
    state: started

- name: Apply restarts now
  ansible.builtin.meta: flush_handlers

# ---- Healthcheck: DNS answers on port 53 and the admin UI answers (200, or 302 to login/install)
- name: Healthcheck DNS query
  ansible.builtin.command: "dig +short +time=3 +tries=1 @127.0.0.1 -p {{ app_adguard_dns_port }} example.com A"
  register: _adguard_dig
  retries: 10
  delay: 3
  until: _adguard_dig.rc == 0 and _adguard_dig.stdout | trim | length > 0
  changed_when: false

- name: Healthcheck web UI
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_adguard_http_port }}/"
    follow_redirects: none
    status_code: [200, 302]
  register: _adguard_hc
  retries: 10
  delay: 3
  until: _adguard_hc.status in [200, 302]
