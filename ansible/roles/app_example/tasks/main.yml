# Pattern for every app role: packages -> stack from apps/<name>/ -> service -> healthcheck. Copy to app_<name>.
- name: Docker engine
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: App directory
  ansible.builtin.file:
    path: "/opt/{{ app_name }}"
    state: directory
    mode: "0750"

- name: Stack
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../apps/_example/compose.yaml.j2"
    dest: "/opt/{{ app_name }}/compose.yaml"
    mode: "0640"
  notify: restart app

- name: Running
  ansible.builtin.command: docker compose -f /opt/{{ app_name }}/compose.yaml up -d
  changed_when: false

- name: Healthcheck
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/"
  register: _hc
  retries: 10
  delay: 3
  until: _hc.status == 200
