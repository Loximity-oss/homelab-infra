# Every host gets the base layer. Application layers (AdGuard, k3s, ...) are deployed by homelab-apps
# (docs/proposals/homelab-apps/); only hm1-dmz-app01 (VM 210, not migrated) keeps a play here.
- name: Base layer
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH (new guests)
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - base_common

# Local admin user with sudo and a write-once OpenBao password: this one host only (Faris 2026-10-18).
# Matches no hosts (play skipped) anywhere else.
- name: Admin user (hm1-dmz-app01 only)
  hosts: hm1-dmz-app01
  gather_facts: false
  roles:
    - base_admin_user
