- name: Wait until keyctl is available (feat-keyctl guests; set by host/pve-feature-broker)
  ansible.builtin.command: python3 -c "import ctypes,sys; sys.exit(0 if ctypes.CDLL(None, use_errno=True).syscall(250, 0, -3, 0) >= 0 else 1)"
  register: base_keyctl
  changed_when: false
  failed_when: false
  until: base_keyctl.rc == 0
  retries: 20
  delay: 6
  when: keyctl | default(false)

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install base packages (Debian family)
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600
  when: ansible_os_family == 'Debian'

- name: Install base packages (Arch)
  community.general.pacman:
    name: "{{ base_packages_arch }}"
    state: present
    update_cache: true
  when: ansible_os_family == 'Archlinux'

- name: Set hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: One-time admin password into OpenBao (design-v7 decision 9)
  ansible.builtin.include_tasks: admin_secret.yml
  when: lookup('env', 'GUEST_SECRET_TOKEN') | length > 0

- name: ci-apps deploy key on homelab-apps deployment hosts only
  ansible.builtin.include_tasks: ci_apps_key.yml
  when: base_ci_apps_hosts is defined
